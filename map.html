<!doctype html><html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>The Lookout - Live Units</title>
<link rel="stylesheet" href="/leaflet.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#0b0f14;color:#e6eef6;font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif}
#map{position:fixed;inset:0;background:#0b0f14}
#bar{position:fixed;top:0;left:0;right:0;z-index:600;display:flex;align-items:center;gap:10px;pointer-events:none;
 height:calc(46px + env(safe-area-inset-top,0px));padding-top:env(safe-area-inset-top,0px);
 padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px));
 background:rgba(17,22,29,.82);border-bottom:1px solid #1e2732;font-size:14px}
#title{font-weight:700;letter-spacing:.5px;color:#7fd1ff}
#status{margin-left:auto;display:flex;align-items:center;gap:7px;color:#9fb3c8}
#dot{width:9px;height:9px;border-radius:50%;background:#2ecc71;box-shadow:0 0 7px #2ecc71}
#dot.bad{background:#e74c3c;box-shadow:0 0 7px #e74c3c}
#banner{position:fixed;left:0;right:0;z-index:650;display:none;text-align:center;font-weight:700;color:#fff;
 background:#c0392b;padding:9px;top:calc(46px + env(safe-area-inset-top,0px))}
.ulbl{background:rgba(11,15,20,.74);border:none;color:#fff;font-weight:600;font-size:13px;box-shadow:none;padding:1px 6px;border-radius:4px}
.ulbl::before{display:none}
.leaflet-container{background:#0b0f14}
</style></head><body>
<div id="map"></div>
<div id="bar"><span id="title">THE LOOKOUT</span>
<span id="status"><span id="clock">--:--:--</span><span id="count">0 units</span><i id="dot"></i></span></div>
<div id="banner"></div>
<script src="/leaflet.js"></script>
<script>
var map = L.map("map",{zoomControl:true, attributionControl:false});
map.setView([30.40,-81.93], 12);   // sane default; re-centers on first units / basemap
var markers={}, first=true, tilesAdded=false;
var GREEN="#2ecc71", AMBER="#f1c40f";

function setupTiles(meta){
  if(tilesAdded || !meta.has_tiles) return;
  tilesAdded=true;
  var b=meta.bounds, sw=[b[1],b[0]], ne=[b[3],b[2]];
  L.tileLayer("/tiles/{z}/{x}/{y}",{minZoom:meta.minzoom, maxZoom:22, maxNativeZoom:meta.maxzoom, bounds:[sw,ne],
    errorTileUrl:"data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw=="}).addTo(map);
  map.setMaxBounds([[sw[0]-0.08,sw[1]-0.08],[ne[0]+0.08,ne[1]+0.08]]);
  if(first && Object.keys(markers).length===0){ map.fitBounds([sw,ne]); }
}
// Keep asking for the basemap until the SSD/MBTiles is ready. This survives a cold boot
// where GL's USB auto-mount finishes a moment AFTER this service starts: the map simply
// appears the instant the drive is mounted, with no restart needed.
function pollMeta(){
  fetch("/meta.json",{cache:"no-store"}).then(function(r){return r.json()}).then(function(meta){
    if(meta.has_tiles) setupTiles(meta); else setTimeout(pollMeta,4000);
  }).catch(function(){ setTimeout(pollMeta,4000); });
}
function tick(){
  fetch("/units.json",{cache:"no-store"}).then(function(r){return r.json()}).then(update)
  .catch(function(){ document.getElementById("dot").className="bad";
    document.getElementById("clock").textContent="reconnecting"; });
}
function update(d){
  document.getElementById("dot").className="";
  document.getElementById("clock").textContent=d.server_time;
  document.getElementById("count").textContent=d.count+(d.count==1?" unit":" units");
  var ban=document.getElementById("banner");
  if(d.alarm&&d.alarm.down){ban.style.display="block";ban.textContent="⚠ RADIO LINK DOWN — "+d.alarm.why;}
  else ban.style.display="none";
  var seen={}, pts=[];
  d.units.forEach(function(u){
    seen[u.id]=1; var ll=[u.lat,u.lon], col=u.stale?AMBER:GREEN, lab=u.name+" · "+u.age+(u.stale?" (stale)":"");
    pts.push(ll);
    if(markers[u.id]){ markers[u.id].setLatLng(ll).setStyle({color:col,fillColor:col}); markers[u.id].setTooltipContent(lab); }
    else { var m=L.circleMarker(ll,{radius:7,color:col,fillColor:col,fillOpacity:1,weight:2}).addTo(map);
           m.bindTooltip(lab,{permanent:true,direction:"right",className:"ulbl",offset:[8,0]}); markers[u.id]=m; }
  });
  Object.keys(markers).forEach(function(id){ if(!seen[id]){ map.removeLayer(markers[id]); delete markers[id]; }});
  if(first && pts.length){ first=false; if(pts.length>1){ map.fitBounds(pts,{padding:[70,70],maxZoom:17}); } else { map.setView(pts[0],16); } }
}
pollMeta();
tick(); setInterval(tick,3000);
</script></body></html>
