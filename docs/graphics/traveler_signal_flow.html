<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  html,body{margin:0;padding:0;background:#ffffff}
  #stage{width:2200px;height:840px;background:#ffffff;font-family:"Segoe UI",system-ui,Arial,sans-serif}
  text{font-family:"Segoe UI",system-ui,Arial,sans-serif}
</style>
</head>
<body>
<div id="stage">
<svg id="svg" width="2200" height="840" viewBox="0 0 2200 840" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arw" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#15202b"/>
    </marker>
    <marker id="arwpow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9aa7b4"/>
    </marker>
  </defs>

  <!-- title -->
  <text x="60" y="62" font-size="42" font-weight="700" fill="#15202b">The Lookout Traveler — Signal Flow</text>
  <text x="62" y="98" font-size="21" fill="#51657a">Radio + GPS in, a live split-screen map out — offline, nothing installed on the viewer.</text>

  <!-- zone headers -->
  <text x="255" y="150" font-size="17" font-weight="700" letter-spacing="2" fill="#16a34a" text-anchor="middle">INPUTS</text>
  <text x="1030" y="150" font-size="17" font-weight="700" letter-spacing="2" fill="#16a34a" text-anchor="middle">THE BOX — GL-MT3000</text>
  <text x="1860" y="150" font-size="17" font-weight="700" letter-spacing="2" fill="#16a34a" text-anchor="middle">ANY BROWSER</text>

  <!-- ===== INPUT CHIPS (all text inside borders) ===== -->
  <g>
    <rect x="60" y="184" width="390" height="100" rx="12" fill="#ffffff" stroke="#cfd9e3" stroke-width="2"/>
    <rect x="60" y="184" width="8" height="100" rx="4" fill="#9aa7b4"/>
    <text x="96" y="228" font-size="25" font-weight="600" fill="#15202b">Battery bank</text>
    <text x="96" y="260" font-size="18" fill="#51657a">5 V USB power</text>
  </g>
  <g>
    <rect x="60" y="304" width="390" height="100" rx="12" fill="#ffffff" stroke="#cfd9e3" stroke-width="2"/>
    <rect x="60" y="304" width="8" height="100" rx="4" fill="#16a34a"/>
    <text x="96" y="348" font-size="25" font-weight="600" fill="#15202b">USB GPS puck</text>
    <text x="96" y="380" font-size="18" fill="#51657a">serial NMEA → /dev/ttyACM0</text>
  </g>
  <g>
    <rect x="60" y="424" width="390" height="100" rx="12" fill="#ffffff" stroke="#cfd9e3" stroke-width="2"/>
    <rect x="60" y="424" width="8" height="100" rx="4" fill="#e08600"/>
    <text x="96" y="468" font-size="25" font-weight="600" fill="#15202b">BK radio</text>
    <text x="96" y="500" font-size="18" fill="#51657a">the fleet · USB RNDIS (usb0)</text>
  </g>
  <g>
    <rect x="60" y="544" width="390" height="100" rx="12" fill="#ffffff" stroke="#cfd9e3" stroke-width="2"/>
    <rect x="60" y="544" width="8" height="100" rx="4" fill="#16a34a"/>
    <text x="96" y="588" font-size="25" font-weight="600" fill="#15202b">USB drive — maps</text>
    <text x="96" y="620" font-size="18" fill="#51657a">your maps (.tpkx / .mbtiles)</text>
  </g>

  <!-- ===== THE BOX ===== -->
  <rect x="580" y="178" width="900" height="486" rx="18" fill="#f7fafc" stroke="#15202b" stroke-width="2.5"/>
  <rect x="580" y="178" width="900" height="54" rx="18" fill="#15202b"/>
  <rect x="580" y="205" width="900" height="27" fill="#15202b"/>
  <text x="1030" y="214" font-size="23" font-weight="700" fill="#ffffff" text-anchor="middle">GL-MT3000 · OpenWrt</text>

  <g>
    <rect x="640" y="268" width="780" height="104" rx="12" fill="#e9f8ef" stroke="#16a34a" stroke-width="2"/>
    <text x="668" y="312" font-size="24" font-weight="700" fill="#166534">gps_source.py</text>
    <text x="668" y="344" font-size="18" fill="#2f6b45">reads the GPS puck</text>
  </g>
  <g>
    <rect x="640" y="400" width="780" height="104" rx="12" fill="#ffffff" stroke="#15202b" stroke-width="2"/>
    <text x="668" y="444" font-size="24" font-weight="700" fill="#15202b">bk_bridge.py</text>
    <text x="668" y="476" font-size="18" fill="#51657a">reads the radio, adds self-GPS · feed on TCP :10110</text>
  </g>
  <g>
    <rect x="640" y="532" width="780" height="104" rx="12" fill="#ffffff" stroke="#15202b" stroke-width="2"/>
    <text x="668" y="576" font-size="24" font-weight="700" fill="#15202b">units_kml.py</text>
    <text x="668" y="608" font-size="18" fill="#51657a">serves the locked split-screen map on :8080</text>
  </g>

  <!-- ===== OUTPUT ===== -->
  <rect x="1580" y="300" width="560" height="364" rx="18" fill="#ffffff" stroke="#0ea5c7" stroke-width="2.5"/>
  <text x="1860" y="346" font-size="25" font-weight="700" fill="#15202b" text-anchor="middle">Any browser</text>
  <text x="1860" y="376" font-size="18" fill="#51657a" text-anchor="middle">phone · tablet · laptop — nothing installed</text>
  <g>
    <rect x="1650" y="404" width="420" height="104" rx="6" fill="#39506a" stroke="#0ea5c7" stroke-width="1.5"/>
    <text x="1664" y="428" font-size="13" fill="#cfe4ef">hybrid aerial</text>
    <circle cx="1860" cy="458" r="9" fill="#2fd4e6"/>
    <circle cx="1928" cy="474" r="7" fill="#35d07f"/>
    <rect x="1650" y="514" width="420" height="104" rx="6" fill="#e9f3ea" stroke="#0ea5c7" stroke-width="1.5"/>
    <text x="1664" y="538" font-size="13" fill="#51657a">street map</text>
    <circle cx="1860" cy="568" r="9" fill="#2fd4e6"/>
    <circle cx="1928" cy="584" r="7" fill="#35d07f"/>
  </g>

  <!-- ===== ARROWS (plain connectors; no floating labels) ===== -->
  <line x1="458" y1="234" x2="576" y2="234" stroke="#9aa7b4" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#arwpow)"/>
  <line x1="458" y1="354" x2="638" y2="322" stroke="#15202b" stroke-width="2.5" marker-end="url(#arw)"/>
  <line x1="458" y1="474" x2="638" y2="452" stroke="#e08600" stroke-width="3" marker-end="url(#arw)"/>
  <line x1="458" y1="594" x2="638" y2="586" stroke="#16a34a" stroke-width="2.5" marker-end="url(#arw)"/>

  <line x1="1030" y1="372" x2="1030" y2="400" stroke="#15202b" stroke-width="2.5" marker-end="url(#arw)"/>
  <line x1="1030" y1="504" x2="1030" y2="532" stroke="#15202b" stroke-width="2.5" marker-end="url(#arw)"/>

  <line x1="1420" y1="584" x2="1578" y2="486" stroke="#0ea5c7" stroke-width="3" marker-end="url(#arw)"/>
  <!-- the one medium label, inside a bordered pill -->
  <g>
    <rect x="1438" y="506" width="210" height="44" rx="22" fill="#ffffff" stroke="#0ea5c7" stroke-width="2"/>
    <text x="1543" y="534" font-size="17" font-weight="600" fill="#0e7f99" text-anchor="middle">Wi-Fi · no internet</text>
  </g>

  <!-- ===== bottom note, inside a border ===== -->
  <rect x="60" y="712" width="2080" height="64" rx="12" fill="#f4f8fb" stroke="#cfd9e3" stroke-width="2"/>
  <text x="90" y="751" font-size="18" fill="#51657a">Offline · nothing installed on the viewer. Two configs: Wi-Fi on — or Wi-Fi off + a USB-C→Ethernet adapter (eth0) for longer battery runtime.</text>
  <text x="2110" y="751" font-size="15" fill="#aeb9c4" text-anchor="end">github.com/Jim-dc95811/The-Lookout · MIT</text>
</svg>
</div>
</body>
</html>
