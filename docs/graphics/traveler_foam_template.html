<!doctype html><html><head><meta charset="utf-8"><style>
  html,body{margin:0;background:#fff;font-family:'Segoe UI',system-ui,Arial,sans-serif}
  svg{display:block}
  text{font-family:'Segoe UI',system-ui,Arial,sans-serif}
</style></head><body>
<svg id="s" viewBox="0 0 480 346" width="1440" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="vent" width="5" height="5" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <rect width="5" height="5" fill="#fff2d6"/>
      <line x1="0" y1="0" x2="0" y2="5" stroke="#d4a017" stroke-width="1.4"/>
    </pattern>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#d4a017"/>
    </marker>
  </defs>

  <!-- title -->
  <text x="14" y="20" font-size="15" font-weight="700" fill="#0b3d6e">THE LOOKOUT TRAVELER — FOAM CUT TEMPLATE</text>
  <text x="14" y="33" font-size="8.5" fill="#55606b">Base tray, top-down · the pop-in core for a light pack · rough scale, trace your real parts before cutting</text>

  <!-- antenna callout (above the block, clear of the title) -->
  <rect x="60" y="42" width="132" height="15" rx="6" fill="#fffdf5" stroke="#d4a017" stroke-width="1.3"/>
  <text x="126" y="52.5" font-size="7" fill="#7a5c00" text-anchor="middle" font-weight="600">ANTENNA WHIP → grommet in lid</text>
  <line x1="126" y1="72" x2="126" y2="59" stroke="#d4a017" stroke-width="2" marker-end="url(#arr)"/>

  <!-- BLOCK -->
  <rect x="12" y="72" width="300" height="258" rx="6" fill="#f4f7fb" stroke="#0b3d6e" stroke-width="2.4"/>
  <line x1="12" y1="72" x2="312" y2="72" stroke="#0b3d6e" stroke-width="2.4"/>
  <!-- top-edge marker, shifted right of the antenna notch -->
  <rect x="150" y="74.5" width="120" height="13" rx="6" fill="#0b3d6e"/>
  <text x="210" y="83.5" font-size="7" font-weight="700" fill="#fff" text-anchor="middle">TOP EDGE ↑ toward pack flap / sky</text>
  <!-- antenna notch through top edge -->
  <rect x="120" y="72" width="12" height="24" fill="#fff" stroke="#0b3d6e" stroke-width="1.4" stroke-dasharray="3 2"/>

  <!-- GPS puck -->
  <circle cx="68" cy="132" r="30" fill="#fff" stroke="#0b3d6e" stroke-width="1.6" stroke-dasharray="4 3"/>
  <text x="68" y="129" font-size="7.5" font-weight="700" fill="#0b3d6e" text-anchor="middle">GPS PUCK</text>
  <text x="68" y="139" font-size="6" fill="#55606b" text-anchor="middle">⌀60 · top row</text>

  <!-- Relay radio -->
  <rect x="112" y="98" width="120" height="62" rx="5" fill="#fff" stroke="#0b3d6e" stroke-width="1.6" stroke-dasharray="4 3"/>
  <text x="172" y="124" font-size="7.5" font-weight="700" fill="#0b3d6e" text-anchor="middle">RELAY RADIO</text>
  <text x="172" y="134" font-size="6" fill="#55606b" text-anchor="middle">BKR 9000 · RX-only · ~135×68</text>

  <!-- USB maps -->
  <rect x="252" y="100" width="48" height="24" rx="4" fill="#fff" stroke="#0b3d6e" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="276" y="110" font-size="6.5" font-weight="700" fill="#0b3d6e" text-anchor="middle">USB MAPS</text>
  <text x="276" y="119" font-size="5.5" fill="#55606b" text-anchor="middle">drive</text>

  <!-- Router (hot) -->
  <rect x="24" y="182" width="112" height="82" rx="5" fill="#fff" stroke="#0b3d6e" stroke-width="1.6" stroke-dasharray="4 3"/>
  <text x="80" y="218" font-size="7.5" font-weight="700" fill="#0b3d6e" text-anchor="middle">ROUTER</text>
  <text x="80" y="228" font-size="6" fill="#55606b" text-anchor="middle">GL-MT3000 · ~120×85</text>
  <rect x="98" y="186" width="34" height="12" rx="6" fill="#c0392b"/>
  <text x="115" y="194.5" font-size="6" font-weight="700" fill="#fff" text-anchor="middle">HOT</text>
  <rect x="140" y="182" width="14" height="82" rx="3" fill="url(#vent)" stroke="#d4a017" stroke-width="1"/>
  <text x="147" y="276" font-size="5.5" fill="#7a5c00" text-anchor="middle">vent</text>

  <!-- Power bank (hot) -->
  <rect x="160" y="182" width="120" height="70" rx="5" fill="#fff" stroke="#0b3d6e" stroke-width="1.6" stroke-dasharray="4 3"/>
  <text x="220" y="214" font-size="7.5" font-weight="700" fill="#0b3d6e" text-anchor="middle">POWER BANK</text>
  <text x="220" y="224" font-size="6" fill="#55606b" text-anchor="middle">PD · ~150×70 (trim to fit)</text>
  <rect x="246" y="186" width="30" height="12" rx="6" fill="#c0392b"/>
  <text x="261" y="194.5" font-size="6" font-weight="700" fill="#fff" text-anchor="middle">HOT</text>
  <rect x="284" y="182" width="14" height="70" rx="3" fill="url(#vent)" stroke="#d4a017" stroke-width="1"/>
  <text x="291" y="264" font-size="5.5" fill="#7a5c00" text-anchor="middle">vent</text>

  <!-- Spare battery -->
  <rect x="24" y="282" width="96" height="36" rx="4" fill="#fff" stroke="#0b3d6e" stroke-width="1.6" stroke-dasharray="4 3"/>
  <text x="72" y="298" font-size="7" font-weight="700" fill="#0b3d6e" text-anchor="middle">SPARE RADIO</text>
  <text x="72" y="308" font-size="7" font-weight="700" fill="#0b3d6e" text-anchor="middle">BATTERY</text>

  <!-- Hub -->
  <rect x="160" y="282" width="100" height="36" rx="4" fill="#fff" stroke="#0b3d6e" stroke-width="1.6" stroke-dasharray="4 3"/>
  <text x="210" y="298" font-size="7" font-weight="700" fill="#0b3d6e" text-anchor="middle">USB HUB</text>
  <text x="210" y="308" font-size="6" fill="#55606b" text-anchor="middle">powered · ~100×37</text>

  <!-- switch well + port out left edge -->
  <circle cx="34" cy="236" r="7" fill="#fff" stroke="#0b3d6e" stroke-width="1.4" stroke-dasharray="3 2"/>
  <line x1="27" y1="236" x2="4" y2="236" stroke="#d4a017" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="6" y="245" width="78" height="14" rx="5" fill="#fffdf5" stroke="#d4a017" stroke-width="1.2"/>
  <text x="45" y="255" font-size="6.3" fill="#7a5c00" text-anchor="middle" font-weight="600">POWER SWITCH port</text>

  <!-- cable grooves (dotted) -->
  <g stroke="#8a97a3" stroke-width="1.2" stroke-dasharray="1.5 2.5" fill="none">
    <path d="M80 182 L80 162"/>
    <path d="M60 182 C 56 170, 64 156, 68 160"/>
    <path d="M136 206 L160 210"/>
    <path d="M110 264 L160 282"/>
  </g>

  <!-- ================= LEGEND ================= -->
  <rect x="322" y="72" width="152" height="246" rx="6" fill="#fff" stroke="#0b3d6e" stroke-width="1.6"/>
  <text x="330" y="90" font-size="9" font-weight="700" fill="#0b3d6e">LEGEND</text>

  <rect x="330" y="98" width="24" height="12" rx="3" fill="#fff" stroke="#0b3d6e" stroke-width="1.4" stroke-dasharray="4 3"/>
  <text x="360" y="107" font-size="7" fill="#33404d">cut line (foam cavity)</text>

  <rect x="330" y="116" width="24" height="12" rx="3" fill="url(#vent)" stroke="#d4a017" stroke-width="1"/>
  <text x="360" y="125" font-size="7" fill="#33404d">vent channel — leave open</text>

  <line x1="330" y1="140" x2="354" y2="140" stroke="#8a97a3" stroke-width="1.4" stroke-dasharray="1.5 2.5"/>
  <text x="360" y="143" font-size="7" fill="#33404d">cable groove (stub tails)</text>

  <line x1="330" y1="156" x2="352" y2="156" stroke="#d4a017" stroke-width="2" marker-end="url(#arr)"/>
  <text x="360" y="159" font-size="7" fill="#33404d">exit port through shell</text>

  <rect x="330" y="166" width="20" height="11" rx="5" fill="#c0392b"/>
  <text x="340" y="174.5" font-size="6" font-weight="700" fill="#fff" text-anchor="middle">HOT</text>
  <text x="356" y="175" font-size="7" fill="#33404d">must breathe (vent it)</text>

  <line x1="330" y1="188" x2="466" y2="188" stroke="#dde4ec" stroke-width="1.4"/>
  <text x="330" y="202" font-size="8" font-weight="700" fill="#0b3d6e">BUILD NOTES</text>
  <g font-size="6.9" fill="#33404d">
    <text x="330" y="215">① TWO LAYERS: this base tray +</text>
    <text x="338" y="224">a thin top sheet to trap parts in.</text>
    <text x="330" y="237">② Pair the vents with a MESH</text>
    <text x="338" y="246">back panel on the pack — the two</text>
    <text x="338" y="255">HOT parts can't sit in sealed foam.</text>
    <text x="330" y="268">③ Puck + antenna ride the TOP</text>
    <text x="338" y="277">row so they still see sky.</text>
    <text x="330" y="290">④ Switch port out the left edge =</text>
    <text x="338" y="299">"flip = power" lever, no opening up.</text>
    <text x="330" y="312">⑤ Rough scale — trace YOUR parts.</text>
  </g>

  <!-- scale bar -->
  <line x1="14" y1="338" x2="64" y2="338" stroke="#0b3d6e" stroke-width="2"/>
  <line x1="14" y1="335" x2="14" y2="341" stroke="#0b3d6e" stroke-width="2"/>
  <line x1="64" y1="335" x2="64" y2="341" stroke="#0b3d6e" stroke-width="2"/>
  <text x="70" y="341" font-size="7" fill="#55606b">≈ 50 mm</text>
</svg>
</body></html>
